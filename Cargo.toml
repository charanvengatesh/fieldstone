[package]
name = "fieldstone"
version = "0.8.0"
edition = "2024"

[dependencies]
# 2D rendering, UI and input only: no 3D, glTF, animation, gizmos, scenes or audio.
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app", "std", "multi_threaded",
    "bevy_window", "bevy_winit", "x11", "wayland",
    "bevy_render", "bevy_core_pipeline", "bevy_camera",
    "bevy_sprite", "bevy_sprite_render",
    "bevy_mesh", "bevy_shader", "bevy_material", "bevy_color",
    "bevy_image", "png",
    "bevy_text", "default_font",
    "bevy_ui", "bevy_ui_render", "bevy_input_focus",
    "bevy_picking", "ui_picking",
] }
# Lua 5.4 built from source; scripts get a small sandboxed standard library.
mlua = { version = "0.11", features = ["lua54", "vendored"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# Bevy's recommended dev profile: light opt for our code, full opt for deps.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
