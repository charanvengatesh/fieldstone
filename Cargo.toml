[package]
name = "fieldstone"
version = "0.6.1"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["wav"] }
bevy_mod_scripting = { version = "0.23", features = ["lua54"] }
noise = "0.9"
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# Bevy's recommended dev profile: light opt for our code, full opt for deps.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
