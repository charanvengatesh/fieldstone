name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run -- --headless-smoke --seed 42

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/fieldstone
          cp -r assets mods README.md dist/fieldstone/
          if [ "$RUNNER_OS" = "Windows" ]; then cp target/release/fieldstone.exe dist/fieldstone/; else cp target/release/fieldstone dist/fieldstone/; fi
          cd dist && 7z a ../fieldstone-${{ matrix.name }}.zip fieldstone
      - uses: softprops/action-gh-release@v2
        with:
          files: fieldstone-${{ matrix.name }}.zip
